<style>
/* Paleta oficial da DLL, a mesma das cartilhas. */
:root {
  color-scheme: light;
  --bg: #f1f5fc; --card: #ffffff; --fg: #0e1b33; --muted: #55627b; --line: #d5dff0; --hover: #f5f8fe;
  --deep: #022a68; --navy: #033a80; --royal: #0350ac; --blue: #006ef3; --blue-soft: #e2edff; --sky: #8cc2ff;
  --tit: #033a80; --link: #0060d6;
  --warn: #8a6500; --warn-forte: #f2b705; --warn-soft: #fff6d6;
  --crit: #c62828; --crit-soft: #fdecec; --ok: #2e7d32; --ok-soft: #e7f4e8; --neutro: #5c6a84; --neutro-soft: #edf1f8;
  --s1: #006ef3; --s2: #eb6834; --s3: #1baf7a; --grade: #e3e9f4; --eixo: #bfcbe0; --mudo: #66738c;
  --sombra: 0 1px 2px rgba(3, 42, 104, .06), 0 6px 20px rgba(3, 42, 104, .06);
  --titulo: Montserrat, "Segoe UI", system-ui, sans-serif; --corpo: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #061430; --card: #0b2049; --fg: #e8eefb; --muted: #9fb0cf; --line: #1b3566; --hover: #10295a;
    --blue: #3d8dff; --blue-soft: #10295a; --tit: #cfe0ff; --link: #7db4ff;
    --warn: #f5c542; --warn-soft: #2f2812; --crit: #ff6b6b; --crit-soft: #3a1c1f; --ok: #6fcf7c; --ok-soft: #12321b; --neutro: #9fb0cf; --neutro-soft: #15294f;
    --s1: #3d8dff; --s2: #d95926; --s3: #199e70; --grade: #17305c; --eixo: #2c4a7d; --mudo: #9fb0cf;
    --sombra: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #061430; --card: #0b2049; --fg: #e8eefb; --muted: #9fb0cf; --line: #1b3566; --hover: #10295a;
  --blue: #3d8dff; --blue-soft: #10295a; --tit: #cfe0ff; --link: #7db4ff;
  --warn: #f5c542; --warn-soft: #2f2812; --crit: #ff6b6b; --crit-soft: #3a1c1f; --ok: #6fcf7c; --ok-soft: #12321b; --neutro: #9fb0cf; --neutro-soft: #15294f;
  --s1: #3d8dff; --s2: #d95926; --s3: #199e70; --grade: #17305c; --eixo: #2c4a7d; --mudo: #9fb0cf;
  --sombra: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--corpo); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--titulo); color: var(--tit); margin: 0; letter-spacing: -.01em; }
button { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 9px; padding: 8px 14px; cursor: pointer; transition: border-color .15s, color .15s, background .15s, filter .15s; }
button:hover:not(:disabled) { border-color: var(--blue); color: var(--link); }
button:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
button.principal { background: var(--blue); border-color: var(--blue); color: #fff; }
button.principal:hover:not(:disabled) { filter: brightness(1.08); color: #fff; }
button.perigo { color: var(--crit); }
button.perigo:hover:not(:disabled) { border-color: var(--crit); color: var(--crit); }
button.mini { padding: 4px 11px; font-size: 13.5px; }
button.link { border: 0; background: none; padding: 0; color: var(--link); font-weight: 600; }
button.link:hover:not(:disabled) { text-decoration: underline; color: var(--link); }

/* ---- estrutura: barra lateral + área */
#app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
#lateral { background: var(--deep); color: #dbe7fb; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.lateral-logo { padding: 18px 20px 12px; }
.lateral-logo img { display: block; width: 172px; height: auto; }
#buscaLateral { padding: 2px 12px 6px; }
#buscaLateral input { width: 100%; padding: 8px 11px; border-radius: 9px; border: 1px solid rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .08); color: #fff; font: inherit; }
#buscaLateral input::placeholder { color: #a9c0e6; }
#menu { display: grid; gap: 2px; padding: 8px 12px; flex: 1; align-content: start; }
#menu button { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; border: 0; background: none; color: #c3d5f4; padding: 9px 12px; border-radius: 9px; white-space: nowrap; }
#menu button:hover { background: rgba(255, 255, 255, .08); color: #fff; }
#menu button[aria-selected="true"] { background: var(--royal); color: #fff; box-shadow: inset 3px 0 0 #8cc2ff; }
#menu svg { flex: none; }
.menu-conta { margin-left: auto; font-size: 12px; font-weight: 700; background: var(--warn-forte); color: #2f2812; border-radius: 99px; padding: 0 7px; }
.lateral-pe { padding: 12px; border-top: 1px solid rgba(255, 255, 255, .12); }
.usuario { display: flex; align-items: center; gap: 10px; padding: 4px 6px 10px; min-width: 0; }
.usuario b { display: block; color: #fff; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.usuario small { color: #a9c0e6; }
.usuario > div { min-width: 0; }
.avatar { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--blue); color: #fff; font: 700 13.5px var(--titulo); }
.lateral-botoes { display: flex; gap: 6px; }
.lateral-botoes button { flex: 1; background: transparent; color: #dbe7fb; border-color: rgba(255, 255, 255, .25); padding: 6px 8px; font-size: 13.5px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.lateral-botoes button:hover:not(:disabled) { color: #fff; border-color: #fff; }
.area { min-width: 0; display: flex; flex-direction: column; }
.faixa-demo { background: var(--warn-soft); color: var(--warn); padding: 7px 28px; font-weight: 600; font-size: 14px; border-bottom: 1px solid color-mix(in srgb, var(--warn-forte) 45%, transparent); }
#conteudo { width: 100%; max-width: 1280px; margin: 0 auto; padding: 22px 28px 48px; display: grid; gap: 18px; }
.titulo-pagina h1 { font-size: 24px; font-weight: 800; }
.titulo-pagina p { margin: 2px 0 0; color: var(--muted); }
.metade { display: grid; gap: 18px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }

@media (max-width: 900px) {
  #app { grid-template-columns: minmax(0, 1fr); }
  #lateral { position: sticky; top: 0; height: auto; z-index: 6; overflow: visible; display: grid; grid-template-columns: 1fr auto; align-items: center; }
  #buscaLateral { grid-column: 1 / -1; padding: 0 10px 6px; }
  .lateral-logo { padding: 10px 14px; }
  .lateral-logo img { width: 112px; }
  .lateral-pe { border: 0; padding: 6px 10px; grid-column: 2; grid-row: 1; }
  .usuario { display: none; }
  .lateral-botoes button { padding: 5px 8px; }
  #menu { grid-column: 1 / -1; display: flex; overflow-x: auto; gap: 2px; padding: 0 10px 8px; }
  #menu button { width: auto; padding: 7px 10px; }
  #menu button svg { display: none; }
  #menu button[aria-selected="true"] { box-shadow: none; }
  .metade { grid-template-columns: minmax(0, 1fr); }
  #conteudo { padding: 16px 16px 36px; gap: 14px; }
  .faixa-demo { padding: 6px 16px; }
  .titulo-pagina h1 { font-size: 21px; }
}

/* ---- peças */
.cartao { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; min-width: 0; box-shadow: var(--sombra); }
.cartao > h2 { font-size: 15.5px; font-weight: 700; margin-bottom: 12px; }
.heroi { position: relative; overflow: hidden; border-radius: 16px; padding: 24px 28px; color: #fff; background: linear-gradient(120deg, var(--deep), var(--royal) 70%, #0a6be0); box-shadow: var(--sombra); }
.heroi::after { content: ""; position: absolute; right: -60px; top: -80px; width: 280px; height: 280px; border-radius: 50%; background: rgba(140, 194, 255, .13); }
.heroi .ola { font-size: 15.5px; color: #cfe0ff; }
.heroi .rot { margin-top: 12px; font-size: 13.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #a9c8f5; }
.heroi .grande { font: 800 clamp(30px, 5vw, 44px)/1.12 var(--titulo); letter-spacing: -.02em; }
.heroi .sub { color: #dbe7fb; margin-top: 2px; }
.numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 12px; }
.numero { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; border-top: 3px solid var(--acento, var(--line)); box-shadow: var(--sombra); }
button.numero { display: block; width: 100%; text-align: left; font-weight: 400; }
button.numero:hover:not(:disabled) { border-color: var(--line); border-top-color: var(--acento, var(--blue)); color: inherit; background: var(--hover); }
.numero .rot { color: var(--muted); font-size: 13.5px; font-weight: 600; }
.numero .val { font: 700 25px/1.25 var(--titulo); color: var(--tit); letter-spacing: -.01em; }
.numero .sub { font-size: 13.5px; color: var(--muted); min-height: 1em; }
.numero.bom { --acento: var(--ok); } .numero.bom .val { color: var(--ok); }
.numero.ruim { --acento: var(--crit); } .numero.ruim .val { color: var(--crit); }
.numero.azul { --acento: var(--blue); }
.numero.alerta { --acento: var(--warn-forte); }
.mudou { margin-top: 2px; color: var(--muted); font-size: 14px; }
.selo { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.selo.ok { background: var(--ok-soft); color: var(--ok); }
.selo.aviso { background: var(--warn-soft); color: var(--warn); }
.selo.erro { background: var(--crit-soft); color: var(--crit); }
.selo.neutro { background: var(--neutro-soft); color: var(--neutro); }
.selo.azul { background: var(--blue-soft); color: var(--link); }
.selo i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.nota { font-size: 14px; color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 8px 14px; }
.caixa { padding: 9px 13px; border-radius: 9px; margin-top: 12px; background: var(--crit-soft); color: var(--crit); }
.controles { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.controles input, .controles select { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); color: var(--fg); max-width: 100%; }
.controles input { width: 230px; }
.conta-linhas { margin-left: auto; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.tabela { overflow-x: auto; }
.tabela.alta { max-height: 66vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; }
.tabela.alta th { position: sticky; top: 0; background: var(--card); z-index: 1; box-shadow: inset 0 -1px 0 var(--line); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 12.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); padding: 9px 10px; white-space: nowrap; }
th.ordena { cursor: pointer; user-select: none; }
th.ordena:hover { color: var(--link); }
td { border-bottom: 1px solid var(--line); padding: 8px 10px; vertical-align: middle; }
tbody tr:hover td { background: var(--hover); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; white-space: nowrap; }
td.quebra { min-width: 200px; }
td.barra-celula { min-width: 130px; }
.barrinha { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.barrinha span { min-width: 42px; text-align: right; }
.barrinha div { flex: 1; max-width: 80px; height: 6px; border-radius: 99px; background: var(--neutro-soft); overflow: hidden; }
.barrinha div i { display: block; height: 100%; border-radius: 99px; background: var(--s1); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chips button[aria-pressed="true"] { border-color: var(--blue); color: var(--link); background: var(--blue-soft); }
.vazio { color: var(--muted); padding: 10px 0; }
.podio { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
.podio > div { border: 1px solid var(--line); border-radius: 12px; padding: 12px 15px; background: var(--hover); }
.podio .pos { font-size: 22px; line-height: 1; }
.podio b { display: block; font: 700 17px var(--titulo); color: var(--tit); margin-top: 6px; }
.podio small { color: var(--muted); }
.grafico { position: relative; }
.grafico svg { display: block; width: 100%; }
.grafico text { font: 12.5px var(--corpo); font-variant-numeric: tabular-nums; fill: var(--mudo); }
.grafico text.forte { fill: var(--fg); font-weight: 700; }
.grafico .alvo { fill: transparent; outline: none; }
.grafico .alvo:hover, .grafico .alvo:focus { fill: var(--neutro-soft); fill-opacity: .55; }
.legenda { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13.5px; color: var(--muted); margin-bottom: 8px; }
.legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
.dica { position: absolute; pointer-events: none; background: var(--deep); color: #fff; border-radius: 8px; padding: 7px 10px; font-size: 13px; white-space: nowrap; display: none; z-index: 3; font-variant-numeric: tabular-nums; box-shadow: 0 4px 14px rgba(0, 0, 0, .25); }
.resumo-texto { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.esqueleto { background: linear-gradient(90deg, var(--neutro-soft), var(--hover), var(--neutro-soft)); background-size: 200% 100%; animation: brilho 1.3s infinite linear; border-radius: 12px; min-height: 92px; }
@keyframes brilho { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .esqueleto { animation: none; } * { transition: none !important; } }

@media (max-width: 900px) {
  .numeros { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .numero { padding: 11px 12px; }
  .numero .val { font-size: 21px; }
  .heroi { padding: 18px 20px; }
}

/* ---- entrar / cadastro */
#telaConta { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
.conta-marca { background: var(--deep); color: #dbe7fb; padding: 44px clamp(28px, 5vw, 72px); display: flex; flex-direction: column; justify-content: center; gap: 20px; position: relative; overflow: hidden; }
.conta-marca::after { content: ""; position: absolute; right: -120px; bottom: -120px; width: 420px; height: 420px; border-radius: 50%; background: rgba(140, 194, 255, .08); }
.conta-marca img { width: 240px; max-width: 70%; height: auto; }
.conta-marca h1 { color: #fff; font-size: clamp(25px, 3vw, 36px); font-weight: 800; line-height: 1.15; }
.conta-marca ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.conta-marca li { display: flex; gap: 10px; align-items: flex-start; }
.conta-marca li svg { flex: none; margin-top: 2px; color: #8cc2ff; }
.conta-form { display: grid; place-items: center; padding: 32px 20px; }
.conta-form .cartao { width: min(420px, 100%); padding: 26px 28px; }
.conta-form h2 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
.conta-form label { display: block; margin-top: 14px; font-weight: 600; font-size: 14.5px; }
.conta-form input { display: block; width: 100%; padding: 10px 12px; margin-top: 5px; font: inherit; font-weight: 400; border: 1px solid var(--line); border-radius: 9px; background: var(--card); color: var(--fg); }
.conta-acoes { margin-top: 18px; display: grid; gap: 12px; }
.conta-acoes button.principal { width: 100%; padding: 11px; }
.conta-links { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; }
@media (max-width: 800px) {
  #telaConta { grid-template-columns: minmax(0, 1fr); align-content: start; }
  .conta-marca { padding: 22px 20px; gap: 10px; }
  .conta-marca img { width: 150px; }
  .conta-marca h1 { font-size: 20px; }
  .conta-marca ul { display: none; }
}

/* ---- administração */
.pessoa { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.pessoa + .pessoa { margin-top: 10px; }
.pessoa.pendente { border-color: var(--warn-forte); background: color-mix(in srgb, var(--warn-soft) 45%, var(--card)); }
.pessoa-topo { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.pessoa-topo .nome b { display: block; }
.pessoa-topo .nome small { color: var(--muted); }
.pessoa-topo .selo { margin-left: auto; }
.modulos { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 14px; margin: 12px 0; }
.interruptor { display: flex; gap: 9px; align-items: center; cursor: pointer; }
.interruptor input { appearance: none; flex: none; width: 34px; height: 20px; margin: 0; border-radius: 99px; background: var(--eixo); position: relative; cursor: pointer; transition: background .15s; }
.interruptor input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.interruptor input:checked { background: var(--blue); }
.interruptor input:checked::after { left: 16px; }
.interruptor small { color: var(--warn); font-weight: 600; }
/* ---- fichas */
dialog#ficha { border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--fg); padding: 0; width: min(860px, calc(100vw - 28px)); max-height: calc(100vh - 40px); box-shadow: 0 16px 50px rgba(0, 0, 0, .35); }
dialog#ficha::backdrop { background: rgba(2, 20, 50, .6); }
.ficha-topo { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); z-index: 2; }
.ficha-topo h2 { font-size: 18px; font-weight: 800; overflow-wrap: anywhere; }
.ficha-corpo { padding: 16px 20px 22px; display: grid; gap: 16px; }
.ficha-corpo h3 { font-size: 14.5px; font-weight: 700; margin-bottom: 8px; }
.sinais { display: grid; gap: 6px; }
.partes { display: grid; gap: 7px; }
.parte { display: grid; grid-template-columns: minmax(120px, 1.2fr) minmax(60px, 1fr) 38px; gap: 10px; align-items: center; }
.parte > div { height: 8px; border-radius: 99px; background: var(--neutro-soft); overflow: hidden; }
.parte i { display: block; height: 100%; border-radius: 99px; background: var(--s1); }
.parte b { text-align: right; font-variant-numeric: tabular-nums; }
.linha-tempo { list-style: none; margin: 0; padding: 0; }
.linha-tempo li { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.linha-tempo li:last-child { border-bottom: 0; }
.linha-tempo span:first-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 18px; margin: 0; }
.campos dt { font-size: 13px; color: var(--muted); }
.campos dd { margin: 0; overflow-wrap: anywhere; font-weight: 600; }
.busca-grande { display: flex; gap: 8px; flex-wrap: wrap; }
.busca-grande input { flex: 1; min-width: 200px; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); color: var(--fg); }
.acao { background: var(--blue-soft); color: var(--link); border-radius: 9px; padding: 9px 13px; }
#aviso { position: fixed; right: 18px; bottom: 18px; background: var(--deep); color: #fff; padding: 11px 16px; border-radius: 10px; display: none; max-width: 420px; box-shadow: 0 6px 22px rgba(0, 0, 0, .3); z-index: 20; }
</style>

  try { await navigator.clipboard.writeText(texto); avisar(recado); } catch (e) { avisar("Não consegui copiar."); }
}
function traduzirErro(erro) {
  const m = String(erro && erro.message || erro || "");
  if (/invalid login/i.test(m)) return "E-mail ou senha incorretos.";
  if (/not confirmed/i.test(m)) return "Confirme seu e-mail primeiro: o link está na sua caixa de entrada.";
  if (/already registered/i.test(m)) return "Esse e-mail já tem cadastro. Tente entrar.";
  if (/rate limit|too many|seconds/i.test(m)) return "Muitas tentativas. Espere alguns minutos e tente de novo.";
  if (/at least|password should/i.test(m)) return "A senha precisa de pelo menos 8 caracteres.";
  return "Não deu certo. Tente de novo em instantes.";
}

const nomeBonito = t => String(t || "").replace(/[._]+/g, " ").trim().split(/\s+/).map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(" ");
const iniciais = t => { const p = nomeBonito(t).split(" ").filter(Boolean); return ((p[0] || "?")[0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase(); };

// ---- tema claro/escuro
function lerTema() { try { return localStorage.getItem("central_tema"); } catch (e) { return null; } }
function aplicarTema(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
aplicarTema(lerTema());
function trocarTema() {
  const escuro = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const novoTema = escuro ? "light" : "dark";
  aplicarTema(novoTema);
  try { localStorage.setItem("central_tema", novoTema); } catch (e) { /* só não lembra da escolha */ }
  if (PERFIL && abaAtual) mostrarAba();
}

function mostrarConta(corpo) {
  el("app").hidden = true;
  el("telaConta").hidden = false;
  const beneficio = t => novo("li", {}, icone("certo"), t);
  limpar(el("telaConta"),
    novo("section", { class: "conta-marca" }, novo("img", { src: LOGO, alt: "DLL Logística" }),
      novo("h1", { text: "A operação inteira em uma tela só." }),
      novo("ul", {}, beneficio("Insucessos, faltantes e agregação no mesmo lugar"), beneficio("Números atualizados pelos robôs da DLL"), beneficio("Cada pessoa vê só o que foi liberado para ela"))),
    novo("div", { class: "conta-form" }, corpo));
}
function telaFormulario(titulo, texto, campos, rotulo, enviar, rodape = []) {
  const erro = novo("div", { class: "caixa", role: "alert", hidden: true });
  const botao = novo("button", { class: "principal", type: "submit", text: rotulo });
  mostrarConta(novo("form", { class: "cartao", onsubmit: async e => {
    e.preventDefault(); erro.hidden = true; botao.disabled = true;
    const falha = await enviar();
    botao.disabled = false;
    if (falha) { erro.textContent = falha; erro.hidden = false; }
  } }, novo("h2", { text: titulo }), novo("p", { class: "suave", style: "margin:0;color:var(--muted)", text: texto }), ...campos, erro,
    novo("div", { class: "conta-acoes" }, botao, ...(rodape.length ? [novo("div", { class: "conta-links" }, ...rodape)] : []))));
}
function campo(id, rotulo, tipo, completar, extra = {}) {
  return novo("label", {}, rotulo, novo("input", { id, type: tipo, autocomplete: completar, required: true, ...extra }));
}
function telaMensagem(titulo, texto, botoes = []) {
  mostrarConta(novo("div", { class: "cartao" }, novo("h2", { text: titulo }), novo("p", { style: "margin:0;color:var(--muted)", text: texto }), novo("div", { class: "conta-acoes" }, ...botoes)));
}
const link = (texto, acao) => novo("button", { class: "link", type: "button", text: texto, onclick: acao });

function telaEntrar() {
  telaFormulario("Entrar", "Use o e-mail e a senha do seu cadastro.",
    [campo("cEmail", "E-mail", "email", "username"), campo("cSenha", "Senha", "password", "current-password")], "Entrar",
    async () => {
      const { error } = await banco.auth.signInWithPassword({ email: el("cEmail").value.trim(), password: el("cSenha").value });
      if (error) return traduzirErro(error);
      iniciar();
    }, [link("Criar cadastro", telaCadastro), link("Esqueci a senha", telaEsqueci)]);
}
function telaCadastro() {
  telaFormulario("Criar cadastro", "Depois de criar, o responsável precisa aprovar seu acesso.",
    [campo("cNome", "Nome e sobrenome", "text", "name", { maxlength: 60, minlength: 3 }), campo("cEmail", "E-mail", "email", "username"),
     campo("cSenha", "Senha (pelo menos 8 caracteres)", "password", "new-password", { minlength: 8 })], "Criar cadastro",
    async () => {
      const { data, error } = await banco.auth.signUp({ email: el("cEmail").value.trim(), password: el("cSenha").value,
        options: { data: { nome: el("cNome").value.trim() }, emailRedirectTo: location.origin + location.pathname } });
      if (error) return traduzirErro(error);
      if (data.session) return iniciar();
      telaMensagem("Confira seu e-mail", "Enviamos um link de confirmação. Pode cair no spam. Depois de confirmar, é só entrar e aguardar a aprovação.", [link("Voltar para entrar", telaEntrar)]);
    }, [link("Já tenho cadastro", telaEntrar)]);
}
function telaEsqueci() {
  telaFormulario("Esqueci a senha", "Enviamos um link para você escolher outra.", [campo("cEmail", "E-mail", "email", "username")], "Enviar link",
    async () => {
      const { error } = await banco.auth.resetPasswordForEmail(el("cEmail").value.trim(), { redirectTo: location.origin + location.pathname });
      if (error) return traduzirErro(error);
      telaMensagem("Confira seu e-mail", "Se esse e-mail tiver cadastro, o link chega em instantes.", [link("Voltar para entrar", telaEntrar)]);
    }, [link("Voltar", telaEntrar)]);
}
function telaNovaSenha() {
  telaFormulario("Escolha a nova senha", "Pelo menos 8 caracteres.", [campo("cSenha", "Nova senha", "password", "new-password", { minlength: 8 })], "Salvar",
    async () => {
      const { error } = await banco.auth.updateUser({ password: el("cSenha").value });
      if (error) return traduzirErro(error);
      avisar("Senha alterada."); iniciar();
    });
}
async function sair() { await banco.auth.signOut(); PERFIL = null; location.hash = ""; telaEntrar(); }

async function iniciar() {
  const { data: { session } } = await banco.auth.getSession();
  if (!session) return telaEntrar();
  const { data: perfil, error } = await banco.from("perfis").select("*").eq("id", session.user.id).single();
  const botaoSair = novo("button", { type: "button", text: "Sair", onclick: sair });
  if (error || !perfil) return telaMensagem("Não consegui carregar seu cadastro", "Tente de novo em instantes.", [novo("button", { class: "principal", text: "Tentar de novo", onclick: iniciar }), botaoSair]);
  PERFIL = perfil;
  if (perfil.status === "pendente") return telaMensagem("Aguardando aprovação", "Seu cadastro foi recebido. O responsável precisa aprovar e escolher o que você vai acessar.", [novo("button", { class: "principal", text: "Verificar de novo", onclick: iniciar }), botaoSair]);
  if (perfil.status === "bloqueado") return telaMensagem("Acesso bloqueado", "Fale com o responsável pela plataforma.", [botaoSair]);
  abrirCasca();
  limpar(el("conteudo"), novo("div", { class: "numeros" }, ...[1, 2, 3, 4].map(() => novo("div", { class: "esqueleto" }))), novo("div", { class: "esqueleto", style: "min-height:280px" }));
  await carregarDados();
}
function abrirCasca() {
  el("telaConta").hidden = true;
  el("app").hidden = false;
  const nome = nomeBonito(PERFIL.nome || PERFIL.email);
  limpar(el("ladoConta"),
    novo("div", { class: "usuario" }, novo("span", { class: "avatar", text: iniciais(PERFIL.nome || PERFIL.email) }),
      novo("div", {}, novo("b", { text: nome, title: PERFIL.email }), novo("small", { text: PERFIL.admin ? "Responsável" : "Acesso liberado" }))),
    novo("div", { class: "lateral-botoes" },
      novo("button", { type: "button", title: "Trocar entre tema claro e escuro", "aria-label": "Trocar tema", onclick: trocarTema }, icone("lua", 15), "Tema"),
      novo("button", { type: "button", onclick: sair }, icone("sair", 15), "Sair")));
}
async function carregarDados() {
  // Só a lista: o conteúdo de cada módulo vem quando a aba é aberta (poupa o limite do plano grátis).
  const { data, error } = await banco.from("dados_modulo").select("modulo, demonstracao, atualizado_em");
  if (error) return telaMensagem("Não consegui carregar os dados", "Tente de novo em instantes.", [novo("button", { class: "principal", text: "Tentar de novo", onclick: iniciar })]);
  DADOS = Object.fromEntries(data.map(d => [d.modulo, d]));
  montarMenu();
}
async function carregarModulo(reg) {
  if (reg.conteudo !== undefined) return true;
  const { data, error } = await banco.from("dados_modulo").select("conteudo").eq("modulo", reg.modulo).single();
  if (error) return false;
  reg.conteudo = data.conteudo;
  return true;
}
function montarMenu() {
  ABAS = MODULOS.filter(m => DADOS[m[0]]).map(m => [m[0], m[1], m[2], m[3]]);
  if (PERFIL.admin) ABAS.push(["admin", "Administração", "Quem acessa e o que cada pessoa vê", "escudo"]);
  if (!ABAS.length) return telaMensagem("Nenhum módulo liberado ainda", "O responsável ainda não liberou nenhum módulo para você.", [novo("button", { class: "principal", text: "Verificar de novo", onclick: iniciar }), novo("button", { text: "Sair", onclick: sair })]);
  el("faixaDemo").hidden = !Object.values(DADOS).some(d => d.demonstracao);
  el("buscaLateral").hidden = !DADOS.busca;
  el("buscaLateral").onsubmit = e => {
    e.preventDefault();
    buscaPendente = el("buscaId").value.trim();
    el("buscaId").value = "";
    if (abaAtual === "busca") mostrarAba(); else location.hash = "busca";
  };
  limpar(el("menu"), ...ABAS.map(([c, t, , ic]) => novo("button", { role: "tab", id: "aba-" + c, onclick: () => { location.hash = c; } }, icone(ic), novo("span", { text: t }))));
  mostrarAba();
  if (PERFIL.admin) contarPendentes();
}
const atualizadoEm = reg => reg && !reg.demonstracao ? "Atualizado em " + new Date(reg.atualizado_em).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) : "";
async function mostrarAba() {
  if (!PERFIL || !ABAS.length) return;
  const pedida = location.hash.slice(1);
  const aba = ABAS.find(a => a[0] === pedida) || ABAS[0];
  abaAtual = aba[0];
  for (const [c] of ABAS) el("aba-" + c).setAttribute("aria-selected", c === abaAtual);
  const raiz = el("conteudo");
  const reg = DADOS[abaAtual];
  if (reg && reg.conteudo === undefined) {
    limpar(raiz, novo("div", { class: "numeros" }, ...[1, 2, 3].map(() => novo("div", { class: "esqueleto" }))), novo("div", { class: "esqueleto", style: "min-height:280px" }));
    const ok = await carregarModulo(reg);
    if (abaAtual !== aba[0]) return;  // trocou de aba enquanto carregava
    if (!ok) return limpar(raiz, novo("div", { class: "caixa", text: "Não consegui carregar este módulo. Atualize a página." }));
  }
  limpar(raiz);
  if (abaAtual !== "inicio") {
    const quando = atualizadoEm(reg);
    raiz.append(novo("div", { class: "titulo-pagina" }, novo("h1", { text: aba[1] }), novo("p", { text: aba[2] + (quando ? " · " + quando.toLowerCase() : "") })));
  }
  TELAS[abaAtual](raiz, reg && reg.conteudo);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", mostrarAba);
let largura = window.innerWidth;
window.addEventListener("resize", () => { if (window.innerWidth === largura) return; largura = window.innerWidth; clearTimeout(mostrarAba.t); mostrarAba.t = setTimeout(mostrarAba, 200); });

// ------------------------------------------------------------ peças das telas
const cartao = (titulo, ...filhos) => novo("section", { class: "cartao" }, novo("h2", { text: titulo }), ...filhos);
function numero(rot, val, sub, classe = "", aba = null) {
  const filhos = [novo("div", { class: "rot", text: rot }), novo("div", { class: "val", text: val }), novo("div", { class: "sub", text: sub || "" })];
  if (aba && ABAS.some(a => a[0] === aba)) return novo("button", { class: "numero " + classe, type: "button", title: "Abrir " + aba, onclick: () => { location.hash = aba; } }, ...filhos);
  return novo("div", { class: "numero " + classe }, ...filhos);

      cartao("Pacotes pendentes", tabelaViva([{ t: "Ação", filtro: true }, { t: "XPT", filtro: true }, { t: "ID", aoClicar: buscarId }, { t: "Insucesso", tipo: "data" }, { t: "Motorista" }], d.lista)));

      cartao("Alertas", tabelaViva([{ t: "Nível", tipo: "selo", filtro: true }, { t: "Dia", tipo: "data" }, { t: "XPT", filtro: true }, { t: "ID", aoClicar: buscarId }, { t: "Produto", quebra: true }, { t: "Valor", tipo: "moeda" }, { t: "Motorista" }, { t: "Hoje", filtro: true }, { t: "Por quê", quebra: true }], l)));
  },
  placar(r, d) {
    const corpo = novo("div"), chips = novo("div", { class: "chips" });
    const MEDALHA = ["🥇", "🥈", "🥉"];
    // Começa na última semana fechada: a atual, no começo da semana, tem pouco dado.

    const desenhar = () => {
      const s = d.semanas[semanaPlacar], linhas = s.linhas, completo = linhas.length && linhas[0].length > 6;
      const naDisputa = linhas.filter(l => l[0] !== "-").slice(0, 3);
      limpar(chips, ...d.semanas.map((x, i) => novo("button", { class: "mini", type: "button", "aria-pressed": i === semanaPlacar ? "true" : "false", text: x.nome, onclick: () => { semanaPlacar = i; desenhar(); } })));
      limpar(corpo, ...(s.parcial || s.congelada === undefined ? [] : [novo("p", { style: "margin:0 0 12px;color:var(--muted)", text: s.congelada ? "Semana congelada: não muda mais." : "Prévia: congela na terça depois do domingo." })]),
        ...(s.parcial ? [novo("p", { style: "margin:0 0 12px;color:var(--muted)", text: "Semana em andamento: os números ainda mudam." })] : []),
        novo("div", { class: "podio" }, ...naDisputa.map((l, i) => novo("div", {}, novo("div", { class: "pos", text: MEDALHA[i] }), novo("b", { text: l[1] }), novo("small", { text: `Nota ${decimal(l[2])}` })))),
        tabelaFixa([{ t: "Posição" }, { t: "XPT" }, { t: "Nota", tipo: "num" }, { t: "D+1", tipo: "pct" }, { t: "Faltantes por 100", tipo: "num" }, { t: "Insucessos", tipo: "num" }, ...(completo ? [{ t: "vs anterior" }, { t: "Resolvido em 3 dias", tipo: "pct" }, { t: "Avaria tratada", tipo: "pct" }] : [])], linhas),
        ...(completo ? [novo("p", { style: "margin:12px 0 0;color:var(--muted);font-size:13.5px", text: "Nota de 0 a 100: agregação D+1 35%, faltantes por 100 insucessos 25%, faltante resolvido em até 3 dias 20%, avaria tratada 10%. * = pouco volume na semana, fica no fim, fora da disputa." })] : []));
    };

    r.append(novo("div", { class: "nota", text: "Uso interno. Não compartilhar com os dispatchers." }), novo("section", { class: "cartao" }, chips, corpo));
  },
  motoristas(r, d) {
    r.append(novo("div", { class: "nota", text: "Uso interno. Número alto é motivo para conferir, não é prova." }),
      cartao("Histórico", tabelaViva([{ t: "Motorista", aoClicar: d.fichas ? nome => { const l = d.lista.find(x => x[0] === nome); if (d.fichas[nome]) fichaMotorista(nome, l, d.fichas[nome]); } : null }, { t: "XPT", filtro: true }, { t: "Insucessos", tipo: "num" }, { t: "Faltantes", tipo: "num" }, { t: "% faltante", tipo: "pct" }, { t: "Perdidos", tipo: "num" }, { t: "R$ faltantes", tipo: "moeda" },
        ...(d.fichas ? [{ t: "Insucesso mais comum", quebra: true }, { t: "Sinais para conferir", quebra: true }] : [])], d.lista)));
  },
  enderecos(r, d) {

      cartao("Cidades com mais insucesso", tabelaViva([{ t: "Cidade" }, { t: "UF", filtro: true }, { t: "XPT", filtro: true }, { t: "Pacotes", tipo: "num" }, { t: "Viraram faltante", tipo: "num" }, { t: "Endereço incorreto", tipo: "num" }, { t: "Motivo mais comum", quebra: true }], d.por_cidade)));
    r.append(cartao("Mais pacotes com insucesso", tabelaViva([{ t: "Endereço", quebra: true }, { t: "Cidade", filtro: true }, { t: "XPT", filtro: true }, { t: "Pacotes", tipo: "num" }, { t: "Motivo mais comum", filtro: true, quebra: true }], d.lista)));
  },
  relatorio(r, d) {
    const corpo = novo("div", { style: "display:grid;gap:14px" });
    const desenhar = () => {
      const s = d.semanas[semanaRel], texto = textoRelatorio(d, s);
      limpar(corpo, novo("div", { class: "chips", style: "margin:0" }, ...d.semanas.map((x, i) => novo("button", { class: "mini", type: "button", "aria-pressed": i === semanaRel ? "true" : "false", text: x.nome, onclick: () => { semanaRel = i; desenhar(); } }))),
        novo("section", { class: "heroi" }, novo("div", { class: "rot", style: "margin:0", text: "Recuperado no total" }), novo("div", { class: "grande", text: moeda(d.recuperado_total) }), novo("div", { class: "sub", text: `${inteiro(d.recuperados_total)} faltantes localizados · ainda a salvar: ${moeda(d.r_salvar)}` })),

// ------------------------------------------------------------ administração
async function buscarPessoas() {
  const { data, error } = await banco.from("perfis").select("*").order("criado_em", { ascending: false });
  return error ? null : data;
}
async function contarPendentes() {
  const lista = await buscarPessoas();
  const n = lista ? lista.filter(p => p.status === "pendente").length : 0;
  const b = el("aba-admin");
  if (!b) return;
  b.querySelector(".menu-conta")?.remove();
  if (n) b.append(novo("span", { class: "menu-conta", text: inteiro(n), "aria-label": `${n} aguardando aprovação` }));
}
const SELO_STATUS = { pendente: ["aviso", "Aguardando aprovação"], aprovado: ["ok", "Aprovado"], bloqueado: ["erro", "Bloqueado"] };
async function desenharPessoas(caixa, nums) {
  const lista = await buscarPessoas();
  if (!lista) return limpar(caixa, novo("div", { class: "caixa", text: "Não consegui carregar a lista." }));
  caixa.className = ""; caixa.textContent = "";
  const qt = s => lista.filter(p => p.status === s).length;
  limpar(nums, numero("Aguardando aprovação", inteiro(qt("pendente")), "", qt("pendente") ? "alerta" : ""), numero("Com acesso", inteiro(qt("aprovado")), "", "bom"), numero("Bloqueados", inteiro(qt("bloqueado")), "", qt("bloqueado") ? "ruim" : ""));
  const ordem = { pendente: 0, aprovado: 1, bloqueado: 2 };
  lista.sort((a, b) => ordem[a.status] - ordem[b.status]);
  limpar(caixa, ...lista.map(p => cartaoPessoa(p, caixa, nums)));
  contarPendentes();
}
function cartaoPessoa(p, caixa, nums) {
  const [cls, txt] = SELO_STATUS[p.status];
  const topo = novo("div", { class: "pessoa-topo" }, novo("span", { class: "avatar", text: iniciais(p.nome || p.email) }), novo("div", { class: "nome" }, novo("b", { text: nomeBonito(p.nome) || "(sem nome)" }), novo("small", { text: p.email })));
  if (p.id === PERFIL.id) {
    topo.append(novo("span", { class: "selo azul", text: "Você: acesso total" }));
    return novo("div", { class: "pessoa" }, topo);
  }
  topo.append(novo("span", { class: "selo " + cls }, novo("i"), txt));
  const marcas = {};
  const modulos = novo("div", { class: "modulos" }, ...MODULOS.map(([c, t, dica]) => {
    marcas[c] = novo("input", { type: "checkbox", role: "switch" });
    marcas[c].checked = p.modulos.includes(c);
    return novo("label", { class: "interruptor", title: dica }, marcas[c], t, ...(INTERNOS.includes(c) ? [novo("small", { text: "interno" })] : []));
  }));
  const marcar = lista => { for (const c of Object.keys(marcas)) marcas[c].checked = lista.includes(c); };
  const atalhos = novo("div", { class: "chips", style: "margin:0 0 4px" }, novo("button", { class: "mini", type: "button", text: "Essencial", onclick: () => marcar(ESSENCIAIS) }),
    novo("button", { class: "mini", type: "button", text: "Tudo", onclick: () => marcar(MODULOS.map(m => m[0])) }), novo("button", { class: "mini", type: "button", text: "Nenhum", onclick: () => marcar([]) }));
  const escolhidos = () => MODULOS.map(m => m[0]).filter(c => marcas[c].checked);
  const salvar = async mudanca => {
    const { error } = await banco.from("perfis").update(mudanca).eq("id", p.id);
    if (error) return avisar("Não consegui salvar.");
    avisar("Salvo. Vale na próxima vez que a pessoa abrir ou atualizar a página.");
    desenharPessoas(caixa, nums);
  };
  const avisoInterno = () => !escolhidos().some(c => INTERNOS.includes(c)) || confirm("Placar e Motoristas são de uso interno. Liberar para essa pessoa?");
  const botoes = [];
  if (p.status === "pendente") botoes.push(novo("button", { class: "principal", type: "button", text: "Aprovar", onclick: () => { if (!escolhidos().length) return avisar("Escolha pelo menos um módulo."); if (avisoInterno()) salvar({ status: "aprovado", modulos: escolhidos(), aprovado_em: new Date().toISOString() }); } }));
  if (p.status === "aprovado") botoes.push(novo("button", { class: "principal", type: "button", text: "Salvar módulos", onclick: () => { if (avisoInterno()) salvar({ modulos: escolhidos() }); } }));
  if (p.status !== "bloqueado") botoes.push(novo("button", { class: "perigo", type: "button", text: p.status === "pendente" ? "Recusar" : "Bloquear", onclick: () => { if (confirm(`Bloquear o acesso de ${nomeBonito(p.nome) || p.email}?`)) salvar({ status: "bloqueado" }); } }));
  else botoes.push(novo("button", { type: "button", text: "Reativar", onclick: () => salvar({ status: "aprovado", aprovado_em: new Date().toISOString() }) }));
  return novo("div", { class: "pessoa " + (p.status === "pendente" ? "pendente" : "") }, topo, ...(p.status === "bloqueado" ? [] : [modulos, atalhos]), novo("div", { class: "controles", style: "margin:10px 0 0" }, ...botoes));
}

banco.auth.onAuthStateChange(evento => { if (evento === "PASSWORD_RECOVERY") setTimeout(telaNovaSenha, 0); });
iniciar();
