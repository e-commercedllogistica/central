<style>
/* Paleta oficial da DLL, a mesma das cartilhas. */
:root {
  color-scheme: light;
  --bg: #f1f5fc; --card: #ffffff; --fg: #0e1b33; --muted: #55627b; --line: #d5dff0; --hover: #f5f8fe;
  --deep: #022a68; --navy: #033a80; --royal: #0350ac; --blue: #006ef3; --blue-soft: #e2edff; --sky: #8cc2ff;
  --tit: #033a80; --link: #0060d6;
  --warn: #8a6500; --warn-forte: #f2b705; --warn-soft: #fff6d6;
  --crit: #c62828; --crit-soft: #fdecec; --ok: #2e7d32; --ok-soft: #e7f4e8; --neutro: #5c6a84; --neutro-soft: #edf1f8;
  --s1: #006ef3; --s2: #eb6834; --s3: #1baf7a; --grade: #e3e9f4; --eixo: #bfcbe0; --mudo: #66738c;
  --sombra: 0 1px 2px rgba(3, 42, 104, .06), 0 6px 20px rgba(3, 42, 104, .06);
  --titulo: Montserrat, "Segoe UI", system-ui, sans-serif; --corpo: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #061430; --card: #0b2049; --fg: #e8eefb; --muted: #9fb0cf; --line: #1b3566; --hover: #10295a;
    --blue: #3d8dff; --blue-soft: #10295a; --tit: #cfe0ff; --link: #7db4ff;
    --warn: #f5c542; --warn-soft: #2f2812; --crit: #ff6b6b; --crit-soft: #3a1c1f; --ok: #6fcf7c; --ok-soft: #12321b; --neutro: #9fb0cf; --neutro-soft: #15294f;
    --s1: #3d8dff; --s2: #d95926; --s3: #199e70; --grade: #17305c; --eixo: #2c4a7d; --mudo: #9fb0cf;
    --sombra: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #061430; --card: #0b2049; --fg: #e8eefb; --muted: #9fb0cf; --line: #1b3566; --hover: #10295a;
  --blue: #3d8dff; --blue-soft: #10295a; --tit: #cfe0ff; --link: #7db4ff;
  --warn: #f5c542; --warn-soft: #2f2812; --crit: #ff6b6b; --crit-soft: #3a1c1f; --ok: #6fcf7c; --ok-soft: #12321b; --neutro: #9fb0cf; --neutro-soft: #15294f;
  --s1: #3d8dff; --s2: #d95926; --s3: #199e70; --grade: #17305c; --eixo: #2c4a7d; --mudo: #9fb0cf;
  --sombra: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--corpo); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--titulo); color: var(--tit); margin: 0; letter-spacing: -.01em; }
button { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 9px; padding: 8px 14px; cursor: pointer; transition: border-color .15s, color .15s, background .15s, filter .15s; }
button:hover:not(:disabled) { border-color: var(--blue); color: var(--link); }
button:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
button.principal { background: var(--blue); border-color: var(--blue); color: #fff; }
button.principal:hover:not(:disabled) { filter: brightness(1.08); color: #fff; }
button.perigo { color: var(--crit); }
button.perigo:hover:not(:disabled) { border-color: var(--crit); color: var(--crit); }
button.mini { padding: 4px 11px; font-size: 13.5px; }
button.link { border: 0; background: none; padding: 0; color: var(--link); font-weight: 600; }
button.link:hover:not(:disabled) { text-decoration: underline; color: var(--link); }

/* ---- estrutura: barra lateral + área */
#app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
#lateral { background: var(--deep); color: #dbe7fb; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.lateral-logo { padding: 18px 20px 12px; }
.lateral-logo img { display: block; width: 172px; height: auto; }
#buscaLateral { padding: 2px 12px 6px; }
#buscaLateral input { width: 100%; padding: 8px 11px; border-radius: 9px; border: 1px solid rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .08); color: #fff; font: inherit; }
#buscaLateral input::placeholder { color: #a9c0e6; }
#menu { display: grid; gap: 2px; padding: 8px 12px; flex: 1; align-content: start; }
#menu button { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; border: 0; background: none; color: #c3d5f4; padding: 9px 12px; border-radius: 9px; white-space: nowrap; }
#menu button:hover { background: rgba(255, 255, 255, .08); color: #fff; }
#menu button[aria-selected="true"] { background: var(--royal); color: #fff; box-shadow: inset 3px 0 0 #8cc2ff; }
#menu svg { flex: none; }
.menu-conta { margin-left: auto; font-size: 12px; font-weight: 700; background: var(--warn-forte); color: #2f2812; border-radius: 99px; padding: 0 7px; }
.lateral-pe { padding: 12px; border-top: 1px solid rgba(255, 255, 255, .12); }
.usuario { display: flex; align-items: center; gap: 10px; padding: 4px 6px 10px; min-width: 0; }
.usuario b { display: block; color: #fff; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.usuario small { color: #a9c0e6; }
.usuario > div { min-width: 0; }
.avatar { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--blue); color: #fff; font: 700 13.5px var(--titulo); }
.lateral-botoes { display: flex; gap: 6px; }
.lateral-botoes button { flex: 1; background: transparent; color: #dbe7fb; border-color: rgba(255, 255, 255, .25); padding: 6px 8px; font-size: 13.5px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.lateral-botoes button:hover:not(:disabled) { color: #fff; border-color: #fff; }
.credito { font-size: 12px; color: #8fa9d6; letter-spacing: .02em; }
.conta-marca .credito { position: absolute; left: clamp(28px, 5vw, 72px); bottom: 22px; z-index: 1; }
.area { min-width: 0; display: flex; flex-direction: column; }
.faixa-demo { background: var(--warn-soft); color: var(--warn); padding: 7px 28px; font-weight: 600; font-size: 14px; border-bottom: 1px solid color-mix(in srgb, var(--warn-forte) 45%, transparent); }
#conteudo { width: 100%; max-width: 1280px; margin: 0 auto; padding: 22px 28px 48px; display: grid; gap: 18px; }
.rodape { margin-top: auto; padding: 14px 28px 20px; text-align: center; font-size: 12.5px; color: var(--muted); }
.titulo-pagina h1 { font-size: 24px; font-weight: 800; }
.titulo-pagina p { margin: 2px 0 0; color: var(--muted); }
.metade { display: grid; gap: 18px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }

@media (max-width: 900px) {
  #app { grid-template-columns: minmax(0, 1fr); }
  #lateral { position: sticky; top: 0; height: auto; z-index: 6; overflow: visible; display: grid; grid-template-columns: 1fr auto; align-items: center; }
  #buscaLateral { grid-column: 1 / -1; padding: 0 10px 6px; }
  .lateral-logo { padding: 10px 14px; }
  .lateral-logo img { width: 112px; }
  .lateral-pe { border: 0; padding: 6px 10px; grid-column: 2; grid-row: 1; }
  .usuario { display: none; }
  .lateral-botoes button { padding: 5px 8px; }
  #menu { grid-column: 1 / -1; display: flex; overflow-x: auto; gap: 2px; padding: 0 10px 8px; }
  #menu button { width: auto; padding: 7px 10px; }
  #menu button svg { display: none; }
  #menu button[aria-selected="true"] { box-shadow: none; }
  .metade { grid-template-columns: minmax(0, 1fr); }
  #conteudo { padding: 16px 16px 36px; gap: 14px; }
  .faixa-demo { padding: 6px 16px; }
  .titulo-pagina h1 { font-size: 21px; }
}

/* ---- vidro (07/11/2026): só onde algo passa por baixo (título ao rolar, barra do
   celular, janelas). Tabelas e números ficam em fundo sólido, pra leitura. */
:root {
  --vidro-fundo: color-mix(in srgb, var(--bg) 70%, transparent);
  --vidro-card: color-mix(in srgb, var(--card) 72%, transparent);
  --vidro-azul: color-mix(in srgb, var(--deep) 80%, transparent);
  --vidro-borda: color-mix(in srgb, var(--line) 75%, transparent);
  --vidro-filtro: blur(14px) saturate(165%);
}
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  @media (min-width: 901px) {
    .titulo-pagina { position: sticky; top: 0; z-index: 4; margin: -10px -28px 0; padding: 12px 28px 12px;
      background: var(--vidro-fundo); -webkit-backdrop-filter: var(--vidro-filtro); backdrop-filter: var(--vidro-filtro);
      border-bottom: 1px solid transparent; transition: border-color .2s, box-shadow .2s; }
    body.rolou .titulo-pagina { border-bottom-color: var(--vidro-borda); box-shadow: 0 8px 24px -14px rgba(3, 42, 104, .35); }
  }
  @media (max-width: 900px) {
    #lateral { background: var(--vidro-azul); -webkit-backdrop-filter: blur(18px) saturate(170%); backdrop-filter: blur(18px) saturate(170%);
      border-bottom: 1px solid rgba(255, 255, 255, .1); }
  }
  dialog#ficha::backdrop { background: rgba(2, 20, 50, .42); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .ficha-topo { background: var(--vidro-card); -webkit-backdrop-filter: var(--vidro-filtro); backdrop-filter: var(--vidro-filtro); }
}
@media (prefers-reduced-transparency: reduce) {
  .titulo-pagina { background: var(--bg) !important; }
  #lateral { background: var(--deep) !important; }
  .ficha-topo { background: var(--card) !important; }
  .titulo-pagina, #lateral, .ficha-topo, dialog#ficha::backdrop { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
}

/* ---- peças */
.cartao { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; min-width: 0; box-shadow: var(--sombra); }
.cartao > h2 { font-size: 15.5px; font-weight: 700; margin-bottom: 12px; }
.heroi { position: relative; overflow: hidden; border-radius: 16px; padding: 24px 28px; color: #fff; background: linear-gradient(120deg, var(--deep), var(--royal) 70%, #0a6be0); box-shadow: var(--sombra); }
.heroi::after { content: ""; position: absolute; right: -60px; top: -80px; width: 280px; height: 280px; border-radius: 50%; background: rgba(140, 194, 255, .13); }
.heroi .ola { font-size: 15.5px; color: #cfe0ff; }
.heroi .rot { margin-top: 12px; font-size: 13.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #a9c8f5; }
.heroi .grande { font: 800 clamp(30px, 5vw, 44px)/1.12 var(--titulo); letter-spacing: -.02em; }
.heroi .sub { color: #dbe7fb; margin-top: 2px; }
.numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 12px; }
.numero { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; border-top: 3px solid var(--acento, var(--line)); box-shadow: var(--sombra); }
button.numero { display: block; width: 100%; text-align: left; font-weight: 400; }
button.numero:hover:not(:disabled) { border-color: var(--line); border-top-color: var(--acento, var(--blue)); color: inherit; background: var(--hover); }
.numero .rot { color: var(--muted); font-size: 13.5px; font-weight: 600; }
.numero .val { font: 700 25px/1.25 var(--titulo); color: var(--tit); letter-spacing: -.01em; }
.numero .sub { font-size: 13.5px; color: var(--muted); min-height: 1em; }
.numero.bom { --acento: var(--ok); } .numero.bom .val { color: var(--ok); }
.numero.ruim { --acento: var(--crit); } .numero.ruim .val { color: var(--crit); }
.numero.azul { --acento: var(--blue); }
.numero.alerta { --acento: var(--warn-forte); }
.mudou { margin-top: 2px; color: var(--muted); font-size: 14px; }
.selo { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.selo.ok { background: var(--ok-soft); color: var(--ok); }
.selo.aviso { background: var(--warn-soft); color: var(--warn); }
.selo.erro { background: var(--crit-soft); color: var(--crit); }
.selo.neutro { background: var(--neutro-soft); color: var(--neutro); }
.selo.azul { background: var(--blue-soft); color: var(--link); }
.selo i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.nota { font-size: 14px; color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 8px 14px; }
.caixa { padding: 9px 13px; border-radius: 9px; margin-top: 12px; background: var(--crit-soft); color: var(--crit); }
.controles { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.controles input, .controles select { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); color: var(--fg); max-width: 100%; }
.controles input { width: 230px; }
.conta-linhas { margin-left: auto; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.tabela { overflow-x: auto; }
.tabela.alta { max-height: 66vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; }
.tabela.alta th { position: sticky; top: 0; background: var(--card); z-index: 1; box-shadow: inset 0 -1px 0 var(--line); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 12.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); padding: 9px 10px; white-space: nowrap; }
th.ordena { cursor: pointer; user-select: none; }
th.ordena:hover { color: var(--link); }
td { border-bottom: 1px solid var(--line); padding: 8px 10px; vertical-align: middle; }
tbody tr:hover td { background: var(--hover); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; white-space: nowrap; }
td.quebra { min-width: 200px; }
td.barra-celula { min-width: 130px; }
.barrinha { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.barrinha span { min-width: 42px; text-align: right; }
.barrinha div { flex: 1; max-width: 80px; height: 6px; border-radius: 99px; background: var(--neutro-soft); overflow: hidden; }
.barrinha div i { display: block; height: 100%; border-radius: 99px; background: var(--s1); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chips button[aria-pressed="true"] { border-color: var(--blue); color: var(--link); background: var(--blue-soft); }
.vazio { color: var(--muted); padding: 10px 0; }
.podio { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
.podio > div { border: 1px solid var(--line); border-radius: 12px; padding: 12px 15px; background: var(--hover); }
.podio .pos { font-size: 22px; line-height: 1; }
.podio b { display: block; font: 700 17px var(--titulo); color: var(--tit); margin-top: 6px; }
.podio small { color: var(--muted); }
.grafico { position: relative; }
.grafico svg { display: block; width: 100%; }
.grafico text { font: 12.5px var(--corpo); font-variant-numeric: tabular-nums; fill: var(--mudo); }
.grafico text.forte { fill: var(--fg); font-weight: 700; }
.grafico .alvo { fill: transparent; outline: none; }
.grafico .alvo:hover, .grafico .alvo:focus { fill: var(--neutro-soft); fill-opacity: .55; }
.legenda { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13.5px; color: var(--muted); margin-bottom: 8px; }
.legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
.dica { position: absolute; pointer-events: none; background: var(--deep); color: #fff; border-radius: 8px; padding: 7px 10px; font-size: 13px; white-space: nowrap; display: none; z-index: 3; font-variant-numeric: tabular-nums; box-shadow: 0 4px 14px rgba(0, 0, 0, .25); }
.resumo-texto { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.esqueleto { background: linear-gradient(90deg, var(--neutro-soft), var(--hover), var(--neutro-soft)); background-size: 200% 100%; animation: brilho 1.3s infinite linear; border-radius: 12px; min-height: 92px; }
@keyframes brilho { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .esqueleto { animation: none; } * { transition: none !important; } }

@media (max-width: 900px) {
  .numeros { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .numero { padding: 11px 12px; }
  .numero .val { font-size: 21px; }
  .heroi { padding: 18px 20px; }
}

/* ---- entrar / cadastro */
/* Tela de entrada sempre na cor da marca (07/11/2026): um fundo azul DLL só, com
   luzes e a grade das rotas; o cartão de acesso é de vidro por cima da luz. */
#telaConta { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); position: relative; isolation: isolate; overflow: hidden;
  color-scheme: dark; color: #eef4ff;
  --fg: #eef4ff; --muted: #b3c6e6; --tit: #ffffff; --link: #9ccaff; --line: rgba(255, 255, 255, .2); --card: rgba(255, 255, 255, .06);
  --blue: #1f7bff; --crit: #ff9b9b; --crit-soft: rgba(255, 107, 107, .14); --ok: #8fe39b; --ok-soft: rgba(111, 207, 124, .14);
  background-color: #021c4c;
  background-image:
    radial-gradient(55% 65% at 8% 12%, rgba(0, 110, 243, .42), transparent 62%),
    radial-gradient(50% 60% at 96% 100%, rgba(3, 80, 172, .6), transparent 66%),
    linear-gradient(160deg, #03306f 0%, #021c4c 55%, #01153a 100%); }
#telaConta::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background-image: linear-gradient(rgba(255, 255, 255, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .05) 1px, transparent 1px);
  background-size: 56px 56px;
  -webkit-mask-image: radial-gradient(ellipse 75% 70% at 30% 45%, #000 25%, transparent 78%); mask-image: radial-gradient(ellipse 75% 70% at 30% 45%, #000 25%, transparent 78%); }
.conta-marca { background: transparent; color: #dbe7fb; padding: 44px clamp(28px, 5vw, 72px); display: flex; flex-direction: column; justify-content: center; gap: 20px; position: relative; }
.conta-marca img { width: 250px; max-width: 70%; height: auto; filter: drop-shadow(0 6px 18px rgba(0, 20, 60, .45)); }
.conta-selo { display: inline-flex; align-items: center; gap: 8px; width: max-content; padding: 5px 12px; border-radius: 99px; border: 1px solid rgba(140, 194, 255, .35); background: rgba(140, 194, 255, .1);
  color: #cfe3ff; font: 700 12px var(--titulo); letter-spacing: .08em; text-transform: uppercase; }
.conta-selo i { width: 7px; height: 7px; border-radius: 50%; background: #5fe08a; box-shadow: 0 0 0 3px rgba(95, 224, 138, .2); }
.conta-marca h1 { color: #fff; font-size: clamp(27px, 3.2vw, 40px); font-weight: 800; line-height: 1.12; max-width: 15ch; }
.conta-marca h1 em { font-style: normal; color: #8cc2ff; }
.conta-marca ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.conta-marca li { display: flex; gap: 10px; align-items: flex-start; }
.conta-marca li svg { flex: none; margin-top: 2px; color: #8cc2ff; }
.conta-form { display: grid; place-items: center; padding: 32px 20px; position: relative; }
/* Luz atrás do cartão: é ela que o vidro desfoca. */
.conta-form::before { content: ""; position: absolute; z-index: -1; width: 420px; height: 420px; left: 50%; top: 50%; transform: translate(-12%, -72%);
  background: radial-gradient(closest-side, rgba(77, 155, 255, .95), rgba(10, 99, 224, .7) 45%, rgba(3, 80, 172, 0)); pointer-events: none; }
.conta-form::after { content: ""; position: absolute; z-index: -1; width: 260px; height: 260px; left: 50%; top: 50%; transform: translate(-108%, 22%);
  background: radial-gradient(closest-side, rgba(140, 194, 255, .5), rgba(140, 194, 255, 0)); pointer-events: none; }
.conta-form .cartao { width: min(420px, 100%); padding: 30px 30px 26px; border-radius: 20px; color: var(--fg);
  background: linear-gradient(150deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .05));
  border: 1px solid rgba(255, 255, 255, .2);

    r.append(nums, novo("div", { class: "nota", text: "Só você vê esta tela. Quem você não aprovar não recebe nenhum dado." }), cartao("Pessoas", caixa));
    desenharPessoas(caixa, nums);
  },
};

// ------------------------------------------------------------ administração
async function buscarPessoas() {
  const { data, error } = await banco.from("perfis").select("*").order("criado_em", { ascending: false });
  return error ? null : data;
}
async function contarPendentes() {
  const lista = await buscarPessoas();
  const n = lista ? lista.filter(p => p.status === "pendente").length : 0;
  const b = el("aba-admin");
  if (!b) return;
  b.querySelector(".menu-conta")?.remove();
  if (n) b.append(novo("span", { class: "menu-conta", text: inteiro(n), "aria-label": `${n} aguardando aprovação` }));
}
const SELO_STATUS = { pendente: ["aviso", "Aguardando aprovação"], aprovado: ["ok", "Aprovado"], bloqueado: ["erro", "Bloqueado"] };
async function desenharPessoas(caixa, nums) {
  const lista = await buscarPessoas();
  if (!lista) return limpar(caixa, novo("div", { class: "caixa", text: "Não consegui carregar a lista." }));
  caixa.className = ""; caixa.textContent = "";
  const qt = s => lista.filter(p => p.status === s).length;
  limpar(nums, numero("Aguardando aprovação", inteiro(qt("pendente")), "", qt("pendente") ? "alerta" : ""), numero("Com acesso", inteiro(qt("aprovado")), "", "bom"), numero("Bloqueados", inteiro(qt("bloqueado")), "", qt("bloqueado") ? "ruim" : ""));
  const ordem = { pendente: 0, aprovado: 1, bloqueado: 2 };
  lista.sort((a, b) => ordem[a.status] - ordem[b.status]);
  limpar(caixa, ...lista.map(p => cartaoPessoa(p, caixa, nums)));
  contarPendentes();
}
function cartaoPessoa(p, caixa, nums) {
  const [cls, txt] = SELO_STATUS[p.status];
  const topo = novo("div", { class: "pessoa-topo" }, novo("span", { class: "avatar", text: iniciais(p.nome || p.email) }), novo("div", { class: "nome" }, novo("b", { text: nomeBonito(p.nome) || "(sem nome)" }), novo("small", { text: p.email })));
  if (p.id === PERFIL.id) {
    topo.append(novo("span", { class: "selo azul", text: "Você: acesso total" }));
    return novo("div", { class: "pessoa" }, topo);
  }
  topo.append(novo("span", { class: "selo " + cls }, novo("i"), txt));
  const marcas = {};
  const modulos = novo("div", { class: "modulos" }, ...MODULOS.map(([c, t, dica]) => {
    marcas[c] = novo("input", { type: "checkbox", role: "switch" });
    marcas[c].checked = p.modulos.includes(c);
    return novo("label", { class: "interruptor", title: dica }, marcas[c], t, ...(INTERNOS.includes(c) ? [novo("small", { text: "interno" })] : []));
  }));
  const marcar = lista => { for (const c of Object.keys(marcas)) marcas[c].checked = lista.includes(c); };
  const atalhos = novo("div", { class: "chips", style: "margin:0 0 4px" }, novo("button", { class: "mini", type: "button", text: "Essencial", onclick: () => marcar(ESSENCIAIS) }),
    novo("button", { class: "mini", type: "button", text: "Tudo", onclick: () => marcar(MODULOS.map(m => m[0])) }), novo("button", { class: "mini", type: "button", text: "Nenhum", onclick: () => marcar([]) }));
  const escolhidos = () => MODULOS.map(m => m[0]).filter(c => marcas[c].checked);
  const salvar = async mudanca => {
    const { error } = await banco.from("perfis").update(mudanca).eq("id", p.id);
    if (error) return avisar("Não consegui salvar.");
    avisar("Salvo. Vale na próxima vez que a pessoa abrir ou atualizar a página.");
    desenharPessoas(caixa, nums);
  };
  const avisoInterno = () => !escolhidos().some(c => INTERNOS.includes(c)) || confirm("Placar e Motoristas são de uso interno. Liberar para essa pessoa?");
  const botoes = [];
  if (p.status === "pendente") botoes.push(novo("button", { class: "principal", type: "button", text: "Aprovar", onclick: () => { if (!escolhidos().length) return avisar("Escolha pelo menos um módulo."); if (avisoInterno()) salvar({ status: "aprovado", modulos: escolhidos(), aprovado_em: new Date().toISOString() }); } }));
  if (p.status === "aprovado") botoes.push(novo("button", { class: "principal", type: "button", text: "Salvar módulos", onclick: () => { if (avisoInterno()) salvar({ modulos: escolhidos() }); } }));
  if (p.status !== "bloqueado") botoes.push(novo("button", { class: "perigo", type: "button", text: p.status === "pendente" ? "Recusar" : "Bloquear", onclick: () => { if (confirm(`Bloquear o acesso de ${nomeBonito(p.nome) || p.email}?`)) salvar({ status: "bloqueado" }); } }));
  else botoes.push(novo("button", { type: "button", text: "Reativar", onclick: () => salvar({ status: "aprovado", aprovado_em: new Date().toISOString() }) }));
  return novo("div", { class: "pessoa " + (p.status === "pendente" ? "pendente" : "") }, topo, ...(p.status === "bloqueado" ? [] : [modulos, atalhos]), novo("div", { class: "controles", style: "margin:10px 0 0" }, ...botoes));
}

banco.auth.onAuthStateChange(evento => { if (evento === "PASSWORD_RECOVERY") setTimeout(telaNovaSenha, 0); });
iniciar();
</script>
